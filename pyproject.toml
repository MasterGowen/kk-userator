[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kk-userator"
version = "2.0.0"
description = "Массовое создание пользователей в Keycloak через Admin API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "kk-userator team", email = "dev@urfu.online"}
]
keywords = [
    "keycloak",
    "user-management",
    "admin-api",
    "bulk-create",
    "sso",
    "identity-management"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Topic :: Utilities"
]
requires-python = ">=3.12"
dependencies = [
    "python-keycloak>=3.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "types-PyYAML>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0"
]

[project.urls]
Homepage = "https://github.com/mastergowen/kk-userator"
Documentation = "https://github.com/mastergowen/kk-userator/tree/main/docs"
Repository = "https://github.com/mastergowen/kk-userator.git"
Issues = "https://github.com/mastergowen/kk-userator/issues"
Changelog = "https://github.com/mastergowen/kk-userator/blob/main/CHANGELOG.md"

[project.scripts]
kk-userator = "keycloak_userator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["keycloak_userator*"]

[tool.setuptools.package-data]
keycloak_userator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=keycloak_userator",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov"
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports ok in __init__
"tests/*" = ["ARG", "S101"]  # unused args ok in tests, assert allowed

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = "keycloak.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["keycloak_userator"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]

[tool.bandit]
targets = ["keycloak_userator"]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert_used (allowed in tests)
